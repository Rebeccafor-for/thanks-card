<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="项目圆满收官 · 庆功贺卡">
<title>项目庆功贺卡</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23d93954'/><text x='50' y='68' font-size='52' font-family='Georgia,serif' font-weight='bold' fill='%23FFF8F5' text-anchor='middle'>p</text></svg>">
<style>
  :root{
    --paper:#FBF3F1;
    --paper-edge:#F0DCD8;
    --rose:#db536a;
    --crimson:#d93954;
    --vermilion:#e0301e;
    --ink:#3A1E22;
    --ink-soft:#8A5A60;
    --cream:#FFF8F5;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;
    background:radial-gradient(circle at 50% 30%, #FDF6F4 0%, #F6E4E1 55%, #EFD3CE 100%);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }

  .stage{
    position:relative;
    width:760px; height:440px;
    perspective:1600px;
    transform-origin:center center;
  }

  .card{
    position:absolute; inset:0;
    transform-style:preserve-3d;
  }

  /* ===== 内页（深红欢迎信）===== */
  .inner-page{
    position:absolute;
    left:0; top:0;
    width:100%; height:100%;
    background:linear-gradient(150deg, var(--crimson) 0%, var(--vermilion) 100%);
    border-radius:10px;
    box-shadow:0 30px 60px rgba(120,30,40,.35);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:34px 40px;
    cursor:pointer;
  }
  .inner-page::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 85% 15%, rgba(255,248,245,.18), transparent 45%),
      radial-gradient(circle at 10% 90%, rgba(255,248,245,.10), transparent 40%);
    pointer-events:none;
  }
  .welcome{
    position:relative;
    width:100%;
    color:var(--cream);
  }
  .welcome-badge{
    display:inline-flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,248,245,.55);
    border-radius:999px;
    padding:6px 16px;
    font-size:12px; letter-spacing:2px;
    color:var(--cream);
    margin-bottom:18px;
  }
  .welcome-badge .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--cream);
    box-shadow:0 0 8px var(--cream);
  }
  .welcome h2{
    margin:0 0 14px 0;
    font-family:Georgia,"Songti SC","SimSun",serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:1px;
    color:#FFFFFF;
    line-height:1.4;
  }
  .welcome p{
    margin:0 0 12px 0;
    font-size:13.5px;
    line-height:1.95;
    color:#FFE4E0;
    letter-spacing:.3px;
  }
  .welcome .sign{
    margin-top:20px;
    padding-top:14px;
    border-top:1px solid rgba(255,248,245,.4);
    font-size:12.5px;
    color:var(--cream);
    letter-spacing:1px;
    line-height:1.8;
  }

  .back-hint{
    position:absolute;
    left:50%; bottom:18px;
    transform:translateX(-50%) translateY(6px);
    font-size:11.5px;
    letter-spacing:2px;
    color:rgba(255,248,245,.65);
    white-space:nowrap;
    opacity:0;
    transition:opacity .5s ease, transform .5s ease;
    pointer-events:none;
  }
  .stage.opened .back-hint{
    opacity:1;
    transform:translateX(-50%) translateY(0);
    transition-delay:1.2s;
  }

  /* ===== 封面（浅粉米色）===== */
  .cover{
    position:absolute;
    left:0; top:0;
    width:100%; height:100%;
    background:linear-gradient(160deg, #FDF7F5 0%, var(--paper) 55%, var(--paper-edge) 100%);
    border-radius:10px;
    box-shadow:0 24px 50px rgba(120,50,55,.28);
    transform-origin:left center;
    transition:transform 1.15s cubic-bezier(.65,.02,.24,1), box-shadow .8s ease;
    z-index:5;
    overflow:visible;
  }
  .cover::after{
    content:"";
    position:absolute; inset:0;
    border-radius:10px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.7), inset 0 0 40px rgba(220,180,175,.25);
    pointer-events:none;
  }

  .cover-inner{
    position:absolute; inset:0;
    padding:38px 46px;
    display:flex; flex-direction:column;
    justify-content:space-between;
  }
  .cover-top{
    display:flex; justify-content:space-between; align-items:flex-start;
  }

  .brand-logo{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:700;
    font-size:30px;
    letter-spacing:-0.5px;
    color:#000000;
    line-height:1;
  }

  .cover-title{
    text-align:center;
    margin-top:6px;
  }
  .cover-title .en{
    font-family:Arial,Helvetica,sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:2px;
    color:var(--ink);
    line-height:1.35;
  }
  .cover-title .cn{
    margin-top:8px;
    font-size:13px;
    letter-spacing:4px;
    color:var(--ink-soft);
  }

  .divider{
    height:2px;
    background:linear-gradient(90deg, transparent, var(--crimson) 12%, var(--crimson) 88%, transparent);
    opacity:.85;
    margin:6px 0;
  }

  .cover-bottom{
    text-align:center;
  }
  .cover-bottom .inv-en{
    font-family:Arial,Helvetica,sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:6px;
    color:var(--ink);
  }

  /* ===== 信封式磁吸扣板 ===== */
  .magnetic-flap{
    position:absolute;
    right:-6px;
    top:50%;
    transform:translateY(-50%);
    width:88px; height:56px;
    cursor:pointer;
    z-index:8;
    transition:transform .3s ease;
  }
  .magnetic-flap:hover{ transform:translateY(-50%) translateX(4px); }
  .magnetic-flap svg{
    width:100%; height:100%; display:block;
    filter:drop-shadow(0 4px 10px rgba(120,30,40,.22));
  }

  .stage.opened .cover{
    transform:rotateY(-118deg);
    box-shadow:0 10px 30px rgba(120,50,55,.15);
  }
  .stage.opened .magnetic-flap{
    opacity:0;
    pointer-events:none;
    transition:opacity .4s ease;
  }

  .hint{
    position:absolute;
    left:50%; bottom:-52px;
    transform:translateX(-50%);
    font-size:12.5px;
    letter-spacing:2px;
    color:#9A6A70;
    white-space:nowrap;
    transition:opacity .5s ease;
  }
  .stage.opened .hint{ opacity:0; }

  .welcome > *{
    opacity:0;
    transform:translateY(14px);
    transition:opacity .7s ease, transform .8s cubic-bezier(.2,.7,.2,1);
  }
  .stage.opened .welcome > *{
    opacity:1;
    transform:translateY(0);
  }
  .stage.opened .welcome > *:nth-child(1){ transition-delay:.55s; }
  .stage.opened .welcome > *:nth-child(2){ transition-delay:.68s; }
  .stage.opened .welcome > *:nth-child(3){ transition-delay:.80s; }
  .stage.opened .welcome > *:nth-child(4){ transition-delay:.92s; }
  .stage.opened .welcome > *:nth-child(5){ transition-delay:1.04s; }

  .spark{
    position:absolute;
    width:6px; height:6px;
    border-radius:50%;
    background:radial-gradient(circle, #FFFFFF 0%, var(--rose) 50%, transparent 72%);
    opacity:0;
    pointer-events:none;
    z-index:9;
  }
  .stage.opened .spark{
    animation:sparkle 1.6s ease-out forwards;
  }
  @keyframes sparkle{
    0%{ opacity:0; transform:scale(.4) translateY(0); }
    30%{ opacity:1; }
    100%{ opacity:0; transform:scale(1.4) translateY(-40px); }
  }

  @media (max-width:820px){
    .stage{ transform:scale(.82); }
  }
  @media (max-width:640px){
    .stage{ transform:scale(.62); }
  }
  @media (max-width:460px){
    .stage{ transform:scale(.46); }
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <!-- 内页：深红欢迎信 -->
  <div class="inner-page" id="innerPage">
    <div class="welcome">
      <div class="welcome-badge"><span class="dot"></span>THANKS FOR YOUR EFFORT</div>
      <h2>项目圆满收官<br>感谢每一位同行者</h2>
      <p>亲爱的团队成员：</p>
      <p>从立项到交付，我们共同走过了一段不平凡的旅程。无数次的讨论、打磨与坚持，最终汇聚成今天这份值得骄傲的成果。感谢你在每一个关键节点上的专业、担当与付出。</p>
      <p>这个项目的成功，属于团队中的每一个人。愿我们带着这份默契与信任，继续奔赴下一段更精彩的征程。</p>
      <div class="sign">
        项目组全体同仁<br>
        2026 · 庆功时刻
      </div>
    </div>
    <div class="back-hint">点击任意处，合上贺卡</div>
  </div>

  <!-- 封面 -->
  <div class="cover" id="cover">
    <div class="cover-inner">
      <div class="cover-top">
        <div class="brand-logo">pwc</div>
      </div>

      <div class="cover-title">
        <div class="en">PROJECT COMPLETION<br>CELEBRATION</div>
        <div class="cn">项目圆满收官 · 庆功贺卡</div>
      </div>

      <div class="divider"></div>

      <div class="cover-bottom">
        <div class="inv-en">THANK YOU</div>
      </div>
    </div>

    <!-- 信封式磁吸扣板 -->
    <div class="magnetic-flap" id="magneticFlap" role="button" tabindex="0" aria-label="抽开贺卡">
      <svg viewBox="0 0 88 56" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 5
                 L82 5
                 Q88 5 88 11
                 L88 45
                 Q88 51 82 51
                 L22 51
                 Q5 51 5 28
                 Q5 5 22 5 Z"
              fill="#d93954" stroke="#FFF8F5" stroke-width="1.6"/>
        <path d="M24 11
                 L80 11
                 Q82 11 82 13
                 L82 43
                 Q82 45 80 45
                 L24 45
                 Q11 45 11 28
                 Q11 11 24 11 Z"
              fill="none" stroke="#FFF8F5" stroke-width="0.9" opacity="0.55"/>
        <circle cx="40" cy="28" r="2.2" fill="#FFF8F5" opacity="0.9"/>
        <circle cx="54" cy="28" r="2.2" fill="#FFF8F5" opacity="0.9"/>
        <circle cx="68" cy="28" r="2.2" fill="#FFF8F5" opacity="0.9"/>
      </svg>
    </div>
  </div>

  <!-- 粒子 -->
  <span class="spark" style="left:20%; top:30%; animation-delay:.5s;"></span>
  <span class="spark" style="left:70%; top:22%; animation-delay:.7s;"></span>
  <span class="spark" style="left:40%; top:60%; animation-delay:.9s;"></span>
  <span class="spark" style="left:82%; top:55%; animation-delay:1.1s;"></span>
  <span class="spark" style="left:30%; top:75%; animation-delay:1.3s;"></span>
  <span class="spark" style="left:60%; top:40%; animation-delay:1.5s;"></span>

  <div class="hint" id="hint">点击右侧扣板，向右抽开贺卡</div>
</div>

<script>
  (function(){
    var stage = document.getElementById('stage');
    var magneticFlap = document.getElementById('magneticFlap');
    var innerPage = document.getElementById('innerPage');
    var hint  = document.getElementById('hint');
    var opened = false;

    function openCard(){
      if(opened) return;
      opened = true;
      stage.classList.add('opened');
      hint.style.opacity = '0';
    }

    function closeCard(){
      if(!opened) return;
      opened = false;
      stage.classList.remove('opened');
      hint.style.opacity = '1';
    }

    magneticFlap.addEventListener('click', function(e){
      e.stopPropagation();
      openCard();
    });

    innerPage.addEventListener('click', function(){
      closeCard();
    });

    magneticFlap.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openCard(); }
    });
  })();
</script>

</body>
</html>
